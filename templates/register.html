<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - CollegeEats</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
        }

        /* NAVBAR */

        nav {
            background: #ff5722;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        /* REGISTER AREA */

        .register-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .register-card {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
        }

        .register-icon {
            text-align: center;
            font-size: 55px;
            margin-bottom: 15px;
        }

        .register-card h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #ff5722;
        }

        .register-btn {
            width: 100%;
            padding: 13px;
            background: #ff5722;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .register-btn:hover {
            background: #e64a19;
        }

        .login-text {
            text-align: center;
            margin-top: 25px;
            color: #666;
        }

        .login-text a {
            color: #ff5722;
            text-decoration: none;
            font-weight: bold;
        }

        .back-home {
            text-align: center;
            margin-top: 15px;
        }

        .back-home a {
            color: #555;
            text-decoration: none;
        }

        /* FOOTER */

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav>

        <div class="logo">
            🍔 CollegeEats
        </div>

        <a href="/">
            🏠 Home
        </a>

    </nav>


    <!-- REGISTER -->

    <div class="register-container">

        <div class="register-card">

            <div class="register-icon">
                📝
            </div>

            <h1>
                Create Account
            </h1>

            <p class="subtitle">
                Join CollegeEats and start ordering 🍔
            </p>


            <form
                method="POST"
                action="/register"
            >

                <div class="form-group">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="register-btn"
                >
                    📝 Create Account
                </button>

            </form>


            <p class="login-text">

                Already have an account?

                <a href="/login">
                    Login Here
                </a>

            </p>


            <div class="back-home">

                <a href="/">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 CollegeEats — College Food Ordering System
        </p>

    </footer>


</body>

</html>
